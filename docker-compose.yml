services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/finsight
      JWT_SECRET: change-me-in-docker
      REDIS_URL: redis://redis:6379
      PORT: 5000
    depends_on: [mongodb, redis]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  mongo_data:
